        minLeadTimeHours: { type: integer }

    CateringPackageDetail:
      allOf:
        - $ref: "#/components/schemas/CateringPackageSummary"
        - type: object
          properties:
            description: { type: string, nullable: true }
            galleryUrls:
              type: array
              items: { type: string }
            serviceStyles:
              type: array
              items: { $ref: "#/components/schemas/CateringServiceStyle" }
            tiers:
              type: array
              description: Volume bands. The quote engine picks the band containing `pax`.
              items:
                type: object
                properties:
                  minPax: { type: integer }
                  maxPax: { type: integer, nullable: true }
                  pricePerPax: { $ref: "#/components/schemas/Money" }

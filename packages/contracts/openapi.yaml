          properties:
            points: { type: integer }
            expiresAt: { type: string, format: date-time }

    LoyaltyLedgerEntry:
      type: object
      properties:
        id: { type: string, format: uuid }
        type:
          type: string
          enum: [EARN_ORDER, EARN_REFERRAL, EARN_SIGNUP_BONUS, EARN_PROMOTION, EARN_REVIEW, REDEEM_ORDER, REDEEM_REWARD, EXPIRE, REVERSAL, MANUAL_ADJUSTMENT]
        points: { type: integer, description: Signed. }
        description: { type: string }
        orderNumber: { type: string, nullable: true }
        expiresAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }

    LoyaltyReward:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string, nullable: true }
        imageUrl: { type: string, nullable: true }
        pointsCost: { type: integer }
        canRedeem: { type: boolean }
        lockedReason:
          type: string
          nullable: true
          enum: [INSUFFICIENT_POINTS, TIER_LOCKED, OUT_OF_STOCK, EXPIRED]

    # -- Identity ------------------------------------------------------------
    AuthSession:
      type: object
      properties:
        accessToken: { type: string }
        refreshToken: { type: string }
        expiresIn: { type: integer, description: Seconds. }
        isNewUser: { type: boolean }
        user: { $ref: "#/components/schemas/User" }

    DeviceRegistration:
      type: object
      required: [platform]
      properties:
        pushToken: { type: string }
        platform: { type: string, enum: [ios, android, web] }
        appVersion: { type: string }
        osVersion: { type: string }

    User:
      type: object
      properties:
        id: { type: string, format: uuid }
        phone: { type: string, nullable: true }
        email: { type: string, nullable: true }
        firstName: { type: string, nullable: true }
        lastName: { type: string, nullable: true }
        avatarUrl: { type: string, nullable: true }
        preferredLanguage: { type: string }
        defaultSpiceLevel: { $ref: "#/components/schemas/SpiceLevel" }
        roles:
          type: array
          items: { type: string }
        loyalty:
          oneOf:
            - $ref: "#/components/schemas/LoyaltyAccount"
            - type: "null"

# ============================================================================
#  REAL-TIME CHANNELS (not REST; documented here so there is one contract)
# ============================================================================
x-realtime-channels:
  transport: >
    Socket.IO over WebSocket at wss://rt.indiagate.sg, authenticated with the
    same access token in the connect payload. Redis adapter for fan-out across
    API instances. Events originate from the transactional outbox relay, never
    from application code emitting directly — that is what keeps the socket
    stream consistent with the database.
  channels:
    - name: "order:{orderId}"
      access: The order's owner, or staff at its outlet.
      events:
        - name: order.status_changed
          payload: "{ orderId, status, occurredAt, estimatedArrivalAt, label }"
        - name: order.eta_updated
          payload: "{ orderId, estimatedArrivalAt, remainingSeconds }"
        - name: order.driver_assigned
          payload: "{ orderId, driver: { name, phoneMasked, vehicleType } }"
        - name: order.driver_location
          payload: "{ orderId, latitude, longitude, headingDegrees, recordedAt }"
          notes: >
            Throttled to one emit per 5 seconds per order. The client
            interpolates between pings rather than snapping the marker.
        - name: order.cancelled
          payload: "{ orderId, reason, refund }"
    - name: "outlet:{outletId}:kds"
      access: KITCHEN_STAFF and OUTLET_MANAGER of that outlet.
      events:
        - name: order.placed
        - name: order.amended
        - name: order.cancelled
        - name: availability.changed
    - name: "user:{userId}"
      access: The user.
      events:
        - name: loyalty.points_earned
        - name: reservation.confirmed
        - name: catering.stage_changed
    - name: "outlet:{outletId}:floor"
      access: Front-of-house staff.
      events:
        - name: reservation.created
        - name: reservation.cancelled
        - name: reservation.seated

                properties:
                  id: { type: string, format: uuid }
                  name: { type: string }
                  description: { type: string, nullable: true }
                  pricingModel:
                    type: string
                    enum: [PER_EVENT, PER_PAX, PER_UNIT]
                  price: { $ref: "#/components/schemas/Money" }
                  maxQuantity: { type: integer, nullable: true }
            depositPercent: { type: number, examples: [30] }
            menuLockHoursBefore: { type: integer }
            cancellationPolicy: { type: string, nullable: true }

    CateringCourse:
      type: object
      description: |
        One step of the selector, e.g. "Starters — choose any 3". The client
        renders and validates purely from these numbers.
      properties:
        id: { type: string, format: uuid }
        stepIndex: { type: integer }
        name: { type: string }
        description: { type: string, nullable: true }
        imageUrl: { type: string, nullable: true }
        isRequired: { type: boolean }
        minSelections: { type: integer }
        maxSelections: { type: integer }
        includedSelections:
          type: integer
          description: Picks beyond this are billed at the option's surcharge.
        allowDuplicates: { type: boolean }
        options:
          type: array
          items:
            type: object
            properties:
              id: { type: string, format: uuid }
              productId: { type: string, format: uuid }
              name: { type: string }
              description: { type: string, nullable: true }
              imageUrl: { type: string, nullable: true }
              spiceLevel: { $ref: "#/components/schemas/SpiceLevel" }
